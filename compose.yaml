services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py seed_demo && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    volumes: ["media:/app/media"]
  worker:
    build: .
    command: celery -A config worker -l INFO -Q default,resume_parse,email
    env_file: .env
    depends_on: [mysql, redis, minio, clamav]
  beat:
    build: .
    command: celery -A config beat -l INFO
    env_file: .env
    depends_on: [mysql, redis]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ats
      MYSQL_USER: ats
      MYSQL_PASSWORD: ats
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports: ["3306:3306"]
    volumes: ["mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/ats-resumes; mc anonymous set none local/ats-resumes"
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]

volumes:
  mysql:
  minio:
  media:
