name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ats_test
          MYSQL_USER: ats
          MYSQL_PASSWORD: ats
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DATABASE_URL: mysql://ats:ats@127.0.0.1:3306/ats_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_TASK_ALWAYS_EAGER: "true"
      MALWARE_SCAN_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -e ".[dev]"
      - name: Grant access to the isolated Django test database
        run: |
          python - <<'PY'
          import pymysql

          with pymysql.connect(host='127.0.0.1', user='root', password='root', autocommit=True) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("GRANT ALL PRIVILEGES ON `test_ats_test`.* TO 'ats'@'%'")
          PY
      - run: npm ci
      - run: npm run audit:prod
      - run: python -m ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: npm run build
      - run: python manage.py collectstatic --noinput
      - name: Test with coverage
        id: tests
        run: python -m pytest -W error --cov --cov-report=term-missing --cov-fail-under=80 --junitxml=pytest-results.xml
      - name: Summarize test failures
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path('pytest-results.xml')
          if report.exists():
              failures = ET.parse(report).getroot().findall('.//failure') + ET.parse(report).getroot().findall('.//error')
              for failure in failures[:3]:
                  message = (failure.get('message') or '')[:300] + '\n' + (failure.text or '')[-3000:]
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title=Pytest failure::{message}')
          PY
