<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{{ static('favicon.svg') }}" type="image/svg+xml">
  <title>{% block title %}Aster ATS{% endblock %}</title>
  <link rel="stylesheet" href="{{ static('css/app.css') }}?v=navy-cobalt-20260823">
  <script src="{{ static('js/app.js') }}?v=navy-cobalt-20260823" defer></script>
</head>
<body class="auth-page">
  <main class="grid min-h-screen place-items-center px-5 py-16">
    <div class="w-full max-w-lg text-center">
      <span class="brand-mark mx-auto h-11 w-11 bg-white text-navy"><i data-lucide="scan-text" class="icon-lg"></i></span>
      <p class="mt-7 text-[10px] font-extrabold uppercase tracking-[0.17em] text-brand-300">{% block eyebrow %}Aster ATS{% endblock %}</p>
      <h1 class="mt-3 text-4xl font-extrabold leading-tight tracking-[-0.05em] text-white sm:text-5xl">{% block heading %}{% endblock %}</h1>
      <p class="mx-auto mt-5 max-w-md text-sm leading-7 text-slate-300">{% block message %}{% endblock %}</p>
      <div class="mt-9 flex flex-col justify-center gap-3 sm:flex-row">
        {% block actions %}{% endblock %}
      </div>
    </div>
  </main>
</body>
</html>
